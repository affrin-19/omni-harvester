; PlatformIO Project Configuration File for Omni-Harvester
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -D CORE_DEBUG_LEVEL=1
    -O2

lib_deps =
    ; Add low-power sensor drivers if needed
